          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          description: Workspace id
          required: true
          schema:
            type: string
        - name: profileUid
          in: path
          description: Profile uid
          required: true
          schema:
            type: string
        - name: since
          in: query
