openapi: 3.1.0
info:
  title: Agorapulse API
  description: |
    # Agorapulse API

    Welcome to the Agorapulse API. Use it to manage publishing, social inbox conversations, analytics and your content library programmatically.

    The API is organized around REST, uses resource-oriented URLs, returns JSON, and relies on standard HTTP response codes and verbs.

    ## Base URL

    All requests go to the base URL shown in the **Server** selector, and every endpoint is versioned under a `/v1.0/` prefix.

    ## Authentication

    The API authenticates requests with an **API key** sent in the `X-API-KEY` HTTP header. Every request must include it:

    ```http
    GET /v1.0/core/organizations HTTP/1.1
    Host: api.agorapulse.com
    X-API-KEY: your-api-key
    ```

    ```bash
    curl https://api.agorapulse.com/v1.0/core/organizations \
      -H "X-API-KEY: your-api-key"
    ```

    Keep your API key secret: it grants access to your account's data. Requests without a valid key return `401 Unauthorized`.

    ## Resource hierarchy

    Most resources are nested under an organization and a workspace:

    ```
    /v1.0/<domain>/organizations/{organizationId}/workspaces/{workspaceId}/...
    ```

    Start from `GET /v1.0/core/organizations` to discover your organizations, then list their workspaces and profiles.

    ## Errors

    The API uses conventional HTTP status codes: `2xx` for success, `4xx` for client errors (a missing or invalid parameter, an unknown resource, a missing API key), and `5xx` for server errors.

    Error responses carry a JSON body describing the problem, except for `405`, `406` and `415`, which answer with a status only:

    ```json
    {
      "code": 1005,
      "subCode": 1104,
      "message": "Media not found: pubmedia_abc123"
    }
    ```

    `code` identifies the error family: either a global one (`1` internal, `2` unauthorized, `3` rate limit exceeded, `4` unprocessable input, `5` validation failed), or the component that produced the error. That component is usually the feature you addressed, but not always — a request whose path matches no endpoint is rejected by the API gateway itself and carries the gateway's own code, `1013`, whichever feature the path pointed at. `subCode` is optional and, when present, pinpoints the exact cause within that component; the endpoints that return one document its values. `message` is a human-readable explanation and is not meant to be parsed.

    ## Webhooks

    Agorapulse can push events to your endpoints. See the **Webhooks** section for the available events (for example `PUBLISHING_POST` and `INBOX_ITEM`) and their payloads.
