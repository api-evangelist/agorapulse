  x-logo:
    url: docs/img/logo.svg
    altText: Agorapulse
security:
  - bearerAuth: []
tags:
  - name: Organizations
    description: List and access the organizations you belong to.
  - name: Workspaces
    description: Workspaces group the social profiles you manage inside an organization.
  - name: Profiles
    description: The connected social profiles within a workspace.
  - name: Groups
    description: Folders that organize a workspace's social profiles, with the profiles each contains.
  - name: Drafts
    description: Create draft posts for review and approval.
  - name: Calendar notes
    description: Annotate your publishing calendar with notes.
  - name: Pinterest boards
    description: List a Pinterest profile's boards to obtain the board id a pin requires.
  - name: Media
    description: Upload media assets to your content library.
  - name: Conversations
    description: Read conversation threads from your social inbox.
  - name: Items
    description: List inbox items (comments, messages, reviews).
  - name: Replies
    description: Reply to inbox items.
  - name: Reports
    description: Pull audience, content and community-management insights.
  - name: Health
    description: Service health and status checks.
  - name: Competitor
    description: ''
paths:
  /v1.0/report/health:
    get:
      tags:
        - Health
      summary: Get health
      description: Provides information about the state of the API
      operationId: health
      responses:
        '200':
          description: The API is healthy and working
          content:
            application/json:
              examples:
                example:
                  value: OK
  /v1.0/report/organizations/{organizationId}/workspaces/{workspaceId}/profiles/{profileUid}/competitors:
    get:
      tags:
        - Competitor
      summary: Get competitors
      description: Get the competitors tracked for the profile, only available for Facebook pages and Instagram business accounts
      operationId: getCompetitors
      parameters:
        - name: organizationId
          in: path
          description: Organization id
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          description: Workspace id
          required: true
          schema:
            type: string
        - name: profileUid
          in: path
          description: Profile uid
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Competitors are returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenCompetitorList'
  /v1.0/report/organizations/{organizationId}/workspaces/{workspaceId}/profiles/{profileUid}/competitors/insights:
    get:
      tags:
        - Competitor
      summary: Get competitor report
      description: Get the aggregated competitor report for the profile, only available for Facebook pages and Instagram business accounts, competitor data is synchronized daily
      operationId: getCompetitorInsights
      parameters:
        - name: organizationId
          in: path
          description: Organization id
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          description: Workspace id
          required: true
          schema:
            type: string
        - name: profileUid
          in: path
          description: Profile uid
          required: true
          schema:
            type: string
        - name: since
          in: query
          required: true
          explode: false
          schema:
            type: string
        - name: until
          in: query
          required: true
          explode: false
          schema:
            type: string
      responses:
        '200':
          description: Competitor report is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenCompetitorReportInsight'
  /v1.0/report/organizations/{organizationId}/workspaces/{workspaceId}/profiles/{profileUid}/insights/audience:
    get:
      tags:
        - Reports
      summary: Get audience report
      description: Get audience report
      operationId: getAudience
      parameters:
        - name: organizationId
          in: path
          description: Organization id
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          description: Workspace id
          required: true
          schema:
            type: string
        - name: profileUid
          in: path
          description: Profile uid
          required: true
          schema:
            type: string
        - name: since
          in: query
          required: true
          explode: false
          schema:
            type: string
        - name: until
          in: query
          required: true
          explode: false
          schema:
            type: string
      responses:
        '200':
          description: Audience is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAudienceInsight'
  /v1.0/report/organizations/{organizationId}/workspaces/{workspaceId}/profiles/{profileUid}/insights/communitymanagement:
