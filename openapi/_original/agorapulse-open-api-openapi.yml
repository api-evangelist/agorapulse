  /v1.0/core/organizations:
    get:
      tags:
        - Organizations
      summary: Get manager organizations
      description: List all organizations the manager belongs to
      operationId: getManagerOrganizations
      parameters:
        - name: v
          in: query
          description: API version
          schema:
            type: string
      responses:
        '200':
          description: List of the manager organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
  /v1.0/core/organizations/{organizationId}/workspaces:
    get:
      tags:
        - Workspaces
      summary: Get organization workspaces
      description: List all the workspaces in an organization
      operationId: getOrganizationWorkspaces
      parameters:
        - name: organizationId
          in: path
          description: Organization id
          required: true
          schema:
            type: string
        - name: v
          in: query
          description: API version
          schema:
            type: string
      responses:
        '200':
          description: List of all workspaces in the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
  /v1.0/core/organizations/{organizationId}/workspaces/{workspaceId}/menugroups:
    get:
      tags:
        - Groups
      summary: List workspace menu groups
      description: List all menu groups in a workspace, including empty ones, with the profiles they contain
      operationId: listWorkspaceMenuGroups
      parameters:
        - name: organizationId
          in: path
          description: Organization id
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          description: Workspace id
          required: true
          schema:
            type: string
        - name: v
          in: query
          description: API version
          schema:
            type: string
