  /v1.0/core/organizations/{organizationId}/workspaces/{workspaceId}/profiles:
    get:
      tags:
        - Profiles
      summary: Get workspace profiles
      description: List all profiles in a workspace
      operationId: getWorkspaceProfiles
      parameters:
        - name: organizationId
          in: path
          description: Organization id
          required: true
          schema:
            type: string
        - name: workspaceId
          in: path
          description: Workspace id
          required: true
          schema:
            type: string
        - name: v
          in: query
          description: API version
          schema:
            type: string
      responses:
        '200':
          description: List of the profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileListResponse'
  /v1.0/publishing/organizations/{organizationId}/workspaces/{workspaceId}/media:
    post:
      tags:
        - Media
      summary: Create a media upload slot
      description: Generates a presigned upload URL and registers a media awaiting upload. Upload the file with a PUT request to uploadUrl before expiresAt, replaying every entry of requiredHeaders verbatim, Content-Type included. Then poll GET /media/{mediaUid} until the status is VALID, INVALID or EXPIRED, or subscribe to the PUBLISHING_MEDIA webhook, which fires with the terminal status.
      operationId: create
      parameters:
        - name: organizationId
          in: path
          description: Organization identifier
          required: true
          schema:
            type: integer
        - name: workspaceId
          in: path
          description: Workspace identifier
          required: true
          schema:
            type: integer
      requestBody:
        description: Media to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaOpenRequest'
        required: true
      responses:
        '201':
          description: Media upload slot created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaOpenResponse'
        '400':
          description: Invalid or unsupported file name
  /v1.0/publishing/organizations/{organizationId}/workspaces/{workspaceId}/media/{mediaUid}:
    get:
      tags:
        - Media
      summary: Get media status
      description: Returns the current status and, once probed, the technical metadata of a media
      operationId: get
      parameters:
        - name: organizationId
          in: path
          description: Organization identifier
          required: true
          schema:
            type: integer
        - name: workspaceId
          in: path
          description: Workspace identifier
          required: true
          schema:
            type: integer
        - name: mediaUid
          in: path
          description: Media identifier
          required: true
      responses:
        '200':
          description: Media found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaStatusOpenResponse'
        '404':
          description: Media not found
        '410':
          description: Media has expired
  /v1.0/publishing/organizations/{organizationId}/workspaces/{workspaceId}/notes:
    get:
      tags:
        - Calendar notes
      summary: Search calendar notes
      description: Search and filter calendar notes in the specified workspace
      operationId: search
      parameters:
        - name: organizationId
          in: path
          description: Organization identifier
          required: true
          schema:
            type: integer
        - name: workspaceId
          in: path
          description: Workspace identifier
          required: true
          schema:
            type: integer
        - name: since
          in: query
          description: Filter notes after this date (ISO date)
          schema:
            type: string
            format: date
        - name: until
          in: query
          description: Filter notes before this date (ISO date)
          schema:
            type: string
            format: date
        - name: profileUids
          in: query
          description: Filter by profile UIDs
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Calendar notes retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCalendarNoteOpenResponse'
        '400':
          description: Invalid search parameters
        '404':
          description: Organization or workspace not found
    post:
      tags:
        - Calendar notes
      summary: Create a new calendar note
      description: Creates a new calendar note in the specified content
      operationId: save
      parameters:
        - name: organizationId
          in: path
          description: Organization identifier
          required: true
          schema:
            type: integer
        - name: workspaceId
          in: path
          description: Workspace identifier
          required: true
          schema:
            type: integer
      requestBody:
        description: Calendar note to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCalendarNoteOpenRequest'
        required: true
      responses:
        '201':
          description: Calendar note created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCalendarNoteOpenResponse'
        '400':
          description: Invalid request data
        '404':
          description: Organization or workspace not found
  /v1.0/publishing/organizations/{organizationId}/workspaces/{workspaceId}/notes/{uid}:
    put:
      tags:
        - Calendar notes
      summary: Update a calendar note
      description: Updates an existing calendar note with new data
      operationId: update
      parameters:
        - name: organizationId
          in: path
          description: Organization identifier
          required: true
          schema:
            type: integer
        - name: workspaceId
          in: path
          description: Workspace identifier
          required: true
          schema:
            type: integer
        - name: uid
          in: path
          description: Calendar note unique identifier
          required: true
          schema:
            type: string
      requestBody:
        description: Updated calendar note data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCalendarNoteOpenRequest'
        required: true
      responses:
        '200':
          description: Calendar note updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCalendarNoteOpenResponse'
        '400':
          description: Invalid request data
        '403':
          description: Insufficient permissions to update the note
        '404':
          description: Calendar note, organization, or workspace not found
    delete:
      tags:
        - Calendar notes
      summary: Delete a calendar note
      description: Deletes a calendar note by its UID
      operationId: delete
      parameters:
        - name: organizationId
          in: path
          description: Organization identifier
          required: true
          schema:
            type: integer
        - name: workspaceId
          in: path
          description: Workspace identifier
          required: true
          schema:
            type: integer
        - name: uid
          in: path
          description: Calendar note unique identifier
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Calendar note deleted successfully
        '403':
          description: Insufficient permissions to delete the note
        '404':
          description: Calendar note, organization, or workspace not found
  /v1.0/publishing/organizations/{organizationId}/workspaces/{workspaceId}/profiles/{profileUid}/pinterest/boards:
    get:
      tags:
        - Pinterest boards
      summary: List a Pinterest profile's boards
      description: Lists the boards a Pinterest profile can publish to, so that an id from the response can be passed as networks.pinterest.boardId when scheduling or publishing. Pinterest rejects a post without a board, and a board id cannot be guessed, so this endpoint is the way to obtain one. Boards are read live from Pinterest on every call.
      operationId: list
      parameters:
        - name: organizationId
          in: path
          description: Organization identifier
          required: true
          schema:
            type: integer
        - name: workspaceId
          in: path
          description: Workspace identifier
          required: true
          schema:
            type: integer
        - name: profileUid
          in: path
          description: Pinterest profile identifier, as returned by the profiles endpoint
          required: true
      responses:
        '200':
          description: Boards retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinterestBoardListOpenResponse'
        '400':
          description: The profile is not in the workspace, is not a Pinterest profile, or has no usable Pinterest token
  /v1.0/publishing/organizations/{organizationId}/workspaces/{workspaceId}/simple-drafts:
    post:
      tags:
        - Drafts
      summary: Create a simple draft (deprecated)
      description: 'Deprecated: use POST /v1.0/publishing/organizations/{organizationId}/workspaces/{workspaceId}/drafts instead (one draft per profile; see the Drafts tag). This endpoint is frozen and will not receive new features such as per-network options.'
      operationId: save_1
      parameters:
        - name: organizationId
          in: path
          description: Organization identifier
          required: true
          schema:
            type: integer
        - name: workspaceId
          in: path
          description: Workspace identifier
          required: true
          schema:
            type: integer
      requestBody:
        description: Simple draft to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSimpleDraftOpenRequest'
        required: true
      responses:
        '201':
          description: Simple draft created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSimpleDraftOpenResponse'
        '400':
          description: Invalid request data
        '404':
          description: Organization or workspace not found
      deprecated: true
  /v1.0/library/organizations/{organizationId}/workspaces/{workspaceId}/studio/media/upload:
    post:
      tags:
        - Media
      summary: Request a presigned upload URL for studio media
      description: Returns a presigned S3 PUT URL that can be used to upload a media file directly to S3
      operationId: requestUpload
      parameters:
        - name: organizationId
          in: path
          description: Organization identifier
          required: true
        - name: workspaceId
          in: path
          description: Workspace identifier
          required: true
      requestBody:
        description: Upload request details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioMediaUploadOpenRequest'
        required: true
      responses:
        '201':
          description: Presigned upload URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioMediaUploadOpenResponse'
        '400':
          description: Invalid request data
        '404':
          description: Organization or workspace not found
  /v1.0/inbox/organizations/{organizationId}/workspaces/{workspaceId}/accounts/{accountUid}/conversations/{conversationId}/messages:
    get:
      tags:
        - Conversations
      summary: Get conversation messages
      operationId: getMessages
      parameters:
        - name: organizationId
          in: path
          description: Organization id
          required: true
          schema:
            type: integer
          example: 1419
        - name: workspaceId
          in: path
          description: Workspace id
          required: true
          schema:
            type: integer
          example: 1416
        - name: accountUid
          in: path
          description: Account uid
          required: true
          schema:
            type: string
          example: facebook_611
        - name: conversationId
          in: path
          description: Conversation id
          required: true
          schema:
            type: string
        - name: since
          in: query
          description: Filter messages created after this date (inclusive). ISO 8601 format.
          schema:
            type: string
            format: date-time
          example: '2025-10-01T09:00:00.000Z'
        - name: until
          in: query
          description: Filter messages created before this date (inclusive). ISO 8601 format.
          schema:
            type: string
            format: date-time
          example: '2025-10-15T13:00:00.000Z'
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of messages to return per page. Must be between 1 and 25.
          schema:
            type: integer
          example: 10
        - name: order
          in: query
          description: Sort order for the results. ASC for ascending (oldest first), DESC for descending (newest first).
          schema:
            $ref: '#/components/schemas/Order'
          example: DESC
      responses:
        '200':
          description: getMessages 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesSearchResponse'
  /v1.0/inbox/organizations/{organizationId}/workspaces/{workspaceId}/accounts/{accountUid}/reply:
    post:
      tags:
        - Replies
      summary: Reply to an item
      operationId: create1
      parameters:
        - name: organizationId
          in: path
          description: Organization id
          required: true
          schema:
            type: integer
          example: 1419
        - name: workspaceId
          in: path
          description: Workspace id
          required: true
          schema:
            type: integer
          example: 1416
        - name: accountUid
          in: path
          description: Account uid
          required: true
          schema:
            type: string
          example: facebook_611
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReplyRequest'
        required: true
      responses:
        '200':
          description: create 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDTO'
  /v1.0/inbox/organizations/{organizationId}/workspaces/{workspaceId}/items:
    get:
      tags:
        - Items
      summary: Find items
      operationId: findItems
      parameters:
        - name: organizationId
          in: path
          description: Organization id
          required: true
          schema:
            type: integer
          example: 1419
        - name: workspaceId
          in: path
          description: Workspace id
          required: true
          schema:
            type: integer
          example: 1416
        - name: accountUids
          in: query
          description: Set of account UIDs to filter items. Only items from these accounts will be returned.
          schema:
            type: array
            items:
              type: string
        - name: toReview
          in: query
          description: Filter items that need review (not yet approved by a manager)
          schema:
            type: boolean
        - name: labels
          in: query
          description: Filter items by labels. Only items with these labels will be returned.
          schema:
            type: array
            items:
              type: string
        - name: sentiments
          in: query
          description: Filter items by sentiment.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ItemSentiment'
        - name: types
          in: query
          description: Filter items by type/source. Specify the types of items to retrieve (e.g., organicComment, adsComment, conversation, ...)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ItemFilterType'
        - name: since
          in: query
          description: Filter items created after this date (inclusive). ISO 8601 format.
          schema:
            type: string
            format: date-time
          example: '2025-10-01T09:00:00.000Z'
        - name: until
          in: query
          description: Filter items created before this date (inclusive). ISO 8601 format.
          schema:
            type: string
            format: date-time
          example: '2025-10-15T13:00:00.000Z'
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of items to return per page. Must be between 1 and 25.
          schema:
            type: integer
