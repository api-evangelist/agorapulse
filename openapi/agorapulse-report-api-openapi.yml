openapi: 3.2.0
info:
  title: Open Report API
  description: Agorapulse's Open API documentation
  version: '1.0'
security:
- bearerAuth: []
tags:
- name: Report
paths:
  /v1.0/report/organizations/{organizationId}/workspaces/{workspaceId}/profiles/{profileUid}/insights/audience:
    get:
      tags:
      - Report
      summary: Get audience report
      description: Get audience report
      operationId: getAudience
      parameters:
      - name: organizationId
        in: path
        description: Organization id
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        description: Workspace id
        required: true
        schema:
          type: string
      - name: profileUid
        in: path
        description: Profile uid
        required: true
        schema:
          type: string
      - name: since
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: until
        in: query
        required: true
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Audience is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAudienceInsight'
  /v1.0/report/organizations/{organizationId}/workspaces/{workspaceId}/profiles/{profileUid}/insights/communitymanagement:
    get:
      tags:
      - Report
      summary: Get community management report
      description: Get community management report
      operationId: getCommunityManagement
      parameters:
      - name: organizationId
        in: path
        description: Organization id
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        description: Workspace id
        required: true
        schema:
          type: string
      - name: profileUid
        in: path
        description: Profile uid
        required: true
        schema:
          type: string
      - name: since
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: until
        in: query
        required: true
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Community management is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityManagementInsight'
  /v1.0/report/organizations/{organizationId}/workspaces/{workspaceId}/profiles/{profileUid}/insights/content:
    get:
      tags:
      - Report
      summary: Get content report
      description: Get content report
      operationId: getContentReport
      parameters:
      - name: organizationId
        in: path
        description: Organization id
        required: true
        schema:
          type: string
      - name: workspaceId
        in: path
        description: Workspace id
        required: true
        schema:
          type: string
      - name: profileUid
        in: path
        description: Profile uid
        required: true
        schema:
          type: string
      - name: since
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: until
        in: query
        required: true
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Content report is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReportInsight_1'
