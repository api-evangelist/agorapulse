generated: '2026-08-13'
method: searched
source: >-
  registry.npmjs.org (search + per-package metadata endpoints), api.github.com/orgs/agorapulse/repos,
  and https://support.agorapulse.com/en/articles/12417183-how-to-connect-to-agorapulse-s-open-api
summary: >-
  Agorapulse ships no conventional REST client SDK in any language. The only first-party libraries
  that speak to api.agorapulse.com are the MCP server and an n8n community node, both published under
  the official @agorapulse npm scope. The rest of the @agorapulse scope is their internal Angular
  design system, and the 80-repo GitHub org is Micronaut/Grails infrastructure libraries that have
  nothing to do with the public API.
