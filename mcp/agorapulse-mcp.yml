deployment:
  mode: both
  endpoint: https://api.openmcp.agorapulse.com/mcp
  install: npx -y @agorapulse/mcp
  package: https://www.npmjs.com/package/@agorapulse/mcp
  auth: oauth
  verified: probed
  note: >-
    Two distinct products. The REMOTE server at https://api.openmcp.agorapulse.com/mcp is the one
    Agorapulse documents for Claude, ChatGPT and Microsoft Copilot Studio; an unauthenticated POST of
    tools/list returns 401 with
    WWW-Authenticate: Bearer resource_metadata="https://api.openmcp.agorapulse.com/.well-known/oauth-protected-resource/mcp",
    which is the RFC 9728 challenge and confirms the endpoint is live and OAuth-protected. The
    LOCAL-STDIO server is the npm package @agorapulse/mcp (1.0.1, published 2025-06-12), which runs
    under npx on the operator's machine and authenticates with a plain X-API-KEY instead.
server:
  name: agorapulse
  transport: http
  url: https://api.openmcp.agorapulse.com/mcp
  protected_resource_metadata: https://api.openmcp.agorapulse.com/.well-known/oauth-protected-resource/mcp
  authorization_server: https://api.identity.agorapulse.com
  scopes: [read]
  clients_documented:
  - Claude (Pro, Max, Team, Enterprise)
  - ChatGPT (Go, Plus, Pro, Team)
  - Microsoft Copilot Studio
  plan_requirement: >-
    Documented as available to all Agorapulse plans except Legacy and Free. Note this is a different
    gate from the REST Reports Open API, which the pricing page restricts to the Custom plan.
local_server:
  name: agorapulse-mcp
  transport: stdio
  package: '@agorapulse/mcp'
  registry: npm
  version: 1.0.1
  published: '2025-06-12'
  bin: agorapulse-mcp
  install: npx -y @agorapulse/mcp
  auth: api-key
  env:
  - name: AGORAPULSE_API_KEY
    required: true
  - name: AGORAPULSE_API_URL
    required: false
    note: Overrides the default https://api.agorapulse.com base.
  runtime: Node.js 20+
  sdk: '@modelcontextprotocol/sdk'
