tools_note: >-
  The live tools/list on the remote endpoint is OAuth-gated, so the schemas below are NOT from the
  hosted server. They are the verbatim tool definitions read out of the published npm package
  @agorapulse/mcp@1.0.1 (dist/index.js, ListToolsRequestSchema handler) — real names, descriptions
  and inputSchemas, but they describe the LOCAL stdio server. The remote server's tool set is
  documented in prose as covering publishing/content, analytics and organization management, which is
  broader than the six below; confirming it requires an authenticated introspection.
tools:
- name: get_organizations
  description: List all organizations accessible to the current manager
  input_schema:
    type: object
    properties: {}
  source_operation: openapi/agorapulse-organizations-api-openapi.yml#getManagerOrganizations
- name: get_workspaces
  description: Get all workspaces within an organization
  input_schema:
    type: object
    properties:
      organizationId: {type: string, description: Organization ID}
    required: [organizationId]
  source_operation: openapi/agorapulse-workspaces-api-openapi.yml#getOrganizationWorkspaces
- name: get_profiles
  description: List social media profiles in a workspace
  input_schema:
    type: object
    properties:
      organizationId: {type: string, description: Organization ID}
      workspaceId: {type: string, description: Workspace ID}
    required: [organizationId, workspaceId]
  source_operation: openapi/agorapulse-profiles-api-openapi.yml#getWorkspaceProfiles
- name: get_audience_insights
  description: Get audience analytics for a profile (followers, demographics). Provide dates in ISO 8601 format.
  input_schema:
    type: object
    properties:
      organizationId: {type: string, description: Organization ID}
      workspaceId: {type: string, description: Workspace ID}
      profileUid: {type: string, description: Profile UID}
      since: {type: string, description: 'Start date in ISO 8601 format (e.g., "2023-01-01" or "2023-01-01T00:00:00Z")'}
      until: {type: string, description: 'End date in ISO 8601 format (e.g., "2023-12-31" or "2023-12-31T23:59:59Z")'}
    required: [organizationId, workspaceId, profileUid, since, until]
  source_operation: openapi/agorapulse-reports-api-openapi.yml#getAudience
- name: get_community_management_insights
  description: Get community management metrics (replies, messages, actions). Provide dates in ISO 8601 format.
  input_schema:
    type: object
    properties:
      organizationId: {type: string, description: Organization ID}
      workspaceId: {type: string, description: Workspace ID}
      profileUid: {type: string, description: Profile UID}
      since: {type: string, description: 'Start date in ISO 8601 format (e.g., "2023-01-01" or "2023-01-01T00:00:00Z")'}
      until: {type: string, description: 'End date in ISO 8601 format (e.g., "2023-12-31" or "2023-12-31T23:59:59Z")'}
    required: [organizationId, workspaceId, profileUid, since, until]
  source_operation: openapi/agorapulse-reports-api-openapi.yml#getCommunityManagement
- name: get_content_insights
  description: Get content performance analytics (posts, engagement, reach). Provide dates in ISO 8601 format.
  input_schema:
    type: object
    properties:
      organizationId: {type: string, description: Organization ID}
      workspaceId: {type: string, description: Workspace ID}
      profileUid: {type: string, description: Profile UID}
      since: {type: string, description: 'Start date in ISO 8601 format (e.g., "2023-01-01" or "2023-01-01T00:00:00Z")'}
      until: {type: string, description: 'End date in ISO 8601 format (e.g., "2023-12-31" or "2023-12-31T23:59:59Z")'}
    required: [organizationId, workspaceId, profileUid, since, until]
  source_operation: openapi/agorapulse-reports-api-openapi.yml#getContentReport
