source: >-
  openapi/_original/agorapulse-open-api-openapi.yml (info.description "Errors" section and the 4xx
  responses on every operation), harvested from https://api.agorapulse.com/docs/open-api.yml
format: proprietary-json
rfc9457: false
description: >-
  Agorapulse does not use RFC 9457 problem+json. It publishes its own three-field error envelope and,
  unusually for a catalog of this size, actually documents what the numeric code means — a global
  family or the component that produced the error — plus an optional subCode that pinpoints the cause
  within that component.
envelope:
  media_type: application/json
  fields:
  - {name: code, type: integer, required: true, description: 'Error family: either a global code or the code of the component that produced the error.'}
  - {name: subCode, type: integer, required: false, description: 'Pinpoints the exact cause within that component. Documented per endpoint where returned.'}
  - {name: message, type: string, required: true, description: 'Human-readable explanation. Explicitly documented as not meant to be parsed.'}
  example: |
    {
      "code": 1005,
      "subCode": 1104,
      "message": "Media not found: pubmedia_abc123"
    }
  exceptions:
  - >-
    405, 406 and 415 answer with a status only and carry no JSON body — an agent must not assume the
    envelope is always present.
global_codes:
- {code: 1, meaning: internal error}
- {code: 2, meaning: unauthorized}
- {code: 3, meaning: rate limit exceeded}
- {code: 4, meaning: unprocessable input}
- {code: 5, meaning: validation failed}
- code: 1013
  meaning: API gateway — no endpoint matches the request path
  note: >-
    Documented trap: a path that matches no endpoint is rejected by the gateway itself and carries
    1013 regardless of which feature the path pointed at, so code does not identify the component in
    this one case.
