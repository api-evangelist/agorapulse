gaps:
- >-
  No error response in the spec declares a schema or an example body, so the {code, subCode, message}
  envelope is documented only in info.description prose — a machine reading the spec alone would not
  find it.
- >-
  The per-component code registry and the per-endpoint subCode values are referenced but not
  published as a table anywhere reachable; only the six global codes above are enumerated.
